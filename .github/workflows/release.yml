name: Release

# Publishes a GitHub Release with the downloadable package whenever main contains a
# Nyordr version that hasn't been released yet (the version is read from Nyordr.html,
# which is built from src/Nyordr.src.html with `npm run build`).
#
# Release assets:
#   - Nyordr.html               the app on its own
#   - nyordr-<version>.zip      the full package (app, guides, license)
#
# To release: bump `version` in src/Nyordr.src.html, run `npm run build`, update nyordr.json +
# CHANGELOG.md, and push to main.

on:
  push:
    branches: [main]
    paths: ['Nyordr.html', 'nyordr.json', 'CHANGELOG.md', '.github/workflows/release.yml']
  workflow_dispatch:
    inputs:
      rebuild:
        description: 'Re-upload assets even if this version is already released'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Read version from Nyordr.html
        id: v
        run: |
          VER=$(grep -m1 'const NYORDR' Nyordr.html | grep -oE 'version:"[0-9]+\.[0-9]+\.[0-9]+[^"]*"' | sed -E 's/version:"([^"]+)"/\1/')
          [ -n "$VER" ] || { echo "::error::Could not find version in Nyordr.html"; exit 1; }
          echo "ver=$VER" >> "$GITHUB_OUTPUT"
          echo "tag=v$VER" >> "$GITHUB_OUTPUT"
          if gh release view "v$VER" >/dev/null 2>&1; then echo "exists=true" >> "$GITHUB_OUTPUT"; else echo "exists=false" >> "$GITHUB_OUTPUT"; fi
          echo "Nyordr version: $VER"

      - name: Check Nyordr.html is built from src
        if: steps.v.outputs.exists == 'false' || inputs.rebuild
        run: |
          npm ci --no-audit --no-fund
          cp Nyordr.html /tmp/committed.html
          npm run build
          cmp -s Nyordr.html /tmp/committed.html \
            || { echo "::error::Nyordr.html is out of date with src/Nyordr.src.html. Run 'npm run build' and commit the result."; exit 1; }

      - name: Check nyordr.json matches
        if: steps.v.outputs.exists == 'false' || inputs.rebuild
        run: |
          grep -q "\"latest\": *\"${{ steps.v.outputs.ver }}\"" nyordr.json \
            || echo "::warning::nyordr.json 'latest' is not ${{ steps.v.outputs.ver }}; existing copies won't be told about this release"

      - name: Build package
        if: steps.v.outputs.exists == 'false' || inputs.rebuild
        run: |
          NAME="nyordr-${{ steps.v.outputs.ver }}"
          mkdir -p "dist/$NAME"
          cp -r Nyordr.html index.html README.md LICENSE.md CHANGELOG.md nyordr.json docs "dist/$NAME/"
          (cd dist && zip -qr "$NAME.zip" "$NAME" && cp "$NAME/Nyordr.html" Nyordr.html)
          ls -la dist

      - name: Release notes
        if: steps.v.outputs.exists == 'false' || inputs.rebuild
        run: |
          awk -v v="## ${{ steps.v.outputs.ver }}" 'index($0,v)==1 {f=1;next} /^## /{if(f)exit} f' CHANGELOG.md > notes.md
          OWNER=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          {
            echo ""
            echo "### Get Nyordr"
            echo "- **Launch in your browser (no download):** https://${OWNER}.github.io/${GITHUB_REPOSITORY#*/}/"
            echo "- **App only:** \`Nyordr.html\`, download and open in any modern browser"
            echo "- **Full package:** \`nyordr-${{ steps.v.outputs.ver }}.zip\`, app plus guides and license"
          } >> notes.md
          cat notes.md

      - name: Publish release
        if: steps.v.outputs.exists == 'false' || inputs.rebuild
        run: |
          TAG="${{ steps.v.outputs.tag }}"
          FILES="dist/Nyordr.html dist/nyordr-${{ steps.v.outputs.ver }}.zip"
          if [ "${{ steps.v.outputs.exists }}" = "true" ]; then
            gh release upload "$TAG" $FILES --clobber
            gh release edit "$TAG" --notes-file notes.md
          else
            gh release create "$TAG" $FILES --target "$GITHUB_SHA" \
              --title "Nyordr ${{ steps.v.outputs.ver }}" --notes-file notes.md --latest
          fi

      - name: Nothing to do
        if: steps.v.outputs.exists == 'true' && !inputs.rebuild
        run: echo "Version ${{ steps.v.outputs.ver }} is already released. Bump the version in Nyordr.html to publish a new release."
